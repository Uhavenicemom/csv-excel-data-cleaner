name: Quality

on:
  push:
  pull_request:

permissions:
  contents: write

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.19.0
          runtime: node@24
          install: false

      - name: Install exact development dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run project checks
        run: pnpm check

      - name: Upload verified browser bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-bundles-${{ github.sha }}
          path: |
            app.js
            xlsx-worker.js
          if-no-files-found: error
          retention-days: 3

      - name: Commit verified bundles on the release branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/final-batch-release'
        run: |
          if git diff --quiet -- app.js xlsx-worker.js; then
            echo "Browser bundles already match the verified source."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js xlsx-worker.js
          git commit -m "Build verified browser bundles"
          git push
